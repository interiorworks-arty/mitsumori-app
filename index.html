<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>見積 v0.1</title><style>
:root{--bg:#f4f1ed;--panel:#fffdf9;--ink:#342f2b;--muted:#7b736d;--line:#d9d0c8;--g:#9b8e83;--g2:#e9e2dc;--dark:#5f554d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#f4f1edf5;border-bottom:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(8px)}.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:900;margin-right:auto}.tabs button,.tools button,.tools select{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:11px}.tabs .on,.tools .primary{background:var(--dark);color:#fff;border-color:var(--dark)}.tools{margin-top:8px}.layout{display:grid;grid-template-columns:minmax(470px,1.1fr) minmax(390px,.9fr);gap:14px;padding:14px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #54483f12}.head{padding:14px 16px;font-weight:900;border-bottom:1px solid var(--line)}.meta{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px;border-bottom:1px solid var(--line)}label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}input,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px;width:100%}.sec{border-bottom:1px solid var(--line)}.secH{background:var(--g2);font-weight:900;padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:105px;z-index:5}.secH span{margin-left:auto}.secH button{border:0;background:transparent;color:var(--dark);font-weight:800}.heads,.row{display:grid;grid-template-columns:minmax(210px,1fr) 55px 88px 76px 96px 28px;gap:5px;align-items:center}.heads{padding:7px 10px 0;font-size:10px;color:var(--muted);text-align:center}.heads div:first-child{text-align:left}.rows{padding:7px 10px}.row{padding:4px 0}.row input{padding:7px 5px;min-width:0}.row .q{border:2px solid var(--g);font-weight:900;font-size:16px;text-align:center;background:#fffdf7}.row .p{text-align:right}.amt{text-align:right;font-weight:800;font-size:12px}.x{border:0;background:transparent;color:#aaa;font-size:18px}.secAct{padding:0 10px 10px;display:flex;gap:6px;flex-wrap:wrap}.secAct button{border:1px dashed var(--g);background:transparent;border-radius:8px;padding:6px 9px;color:var(--dark)}.preview{position:sticky;top:116px;padding:12px}.paper{background:#fff;min-height:800px;padding:26px 28px;box-shadow:0 4px 18px #00000012;font-size:12px}.paper h1{text-align:center;letter-spacing:.15em;margin:0 0 20px}.pTop{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}.company{text-align:right;line-height:1.65;position:relative}.stamp{width:68px;height:68px;object-fit:contain;position:absolute;right:0;top:42px}.ph{background:#eee8e3;border-top:1px solid #bbb;border-bottom:1px solid #bbb;padding:6px 7px;font-weight:900;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:5px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}.sub{text-align:right;font-weight:900;padding:7px 4px 12px}.tot{width:55%;margin:18px 0 0 auto;border-top:2px solid #555}.tot div{display:flex;justify-content:space-between;padding:6px 3px}.grand{border-top:1px solid #999;font-size:15px;font-weight:900}.empty{text-align:center;color:#999;padding:90px 10px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:100;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.mc{background:var(--panel);width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.ma button{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}.ma .save{background:var(--dark);color:#fff}.small{font-size:11px;color:var(--muted)}

</style></head><body><div class="top"><div class="line"><div class="brand">ARTY WORKS</div><div class="tabs"><button onclick="alert('この試作は見積側です')">現調</button><button class="on">見積</button></div></div><div class="line tools"><select id="client"></select><button onclick="addClient()">＋取引先</button><button onclick="openCompany()">自社情報・印鑑</button><button onclick="showHidden()">非表示項目</button><button onclick="newDoc()">新規</button><button class="primary" onclick="window.print()">PDF / 印刷</button></div></div>
<div class="layout"><div class="card left"><div class="head">見積入力 <span class="small">基本は数量だけ入力</span></div><div class="meta"><div><label>宛名</label><input id="customer"></div><div><label>現場名</label><input id="project"></div><div><label>見積タイトル</label><input id="title"></div><div><label>見積日</label><input id="date" type="date"></div><div class="full"><label>備考</label><textarea id="notes" rows="2"></textarea></div></div><div class="heads"><div>品名</div><div>単位</div><div>単価</div><div>数量</div><div>金額</div><div></div></div><div id="secs"></div></div>
<div class="card"><div class="head">出力プレビュー <span class="small">入力した項目だけ表示</span></div><div class="preview"><div class="paper" id="paper"></div></div></div></div>
<div class="modal" id="companyModal"><div class="mc"><h2>自社情報・デジタル印鑑</h2><div class="grid"><div><label>屋号 / 会社名</label><input id="coName"></div><div><label>担当者名</label><input id="coPerson"></div><div class="full"><label>住所</label><input id="coAddress"></div><div><label>電話</label><input id="coTel"></div><div><label>メール</label><input id="coMail"></div><div><label>登録番号</label><input id="coReg"></div><div><label>印鑑画像</label><input id="stamp" type="file" accept="image/*"></div></div><div class="ma"><button onclick="closeCompany()">閉じる</button><button class="save" onclick="saveCompany()">保存</button></div></div></div>
<div class="modal" id="hiddenModal"><div class="mc"><h2>非表示項目</h2><div id="hiddenList"></div><div class="ma"><button onclick="document.getElementById('hiddenModal').classList.remove('on')">閉じる</button></div></div></div>
<script>
const client=document.getElementById('client');
const secs=document.getElementById('secs');
const paper=document.getElementById('paper');
const companyModal=document.getElementById('companyModal');
const hiddenModal=document.getElementById('hiddenModal');
const hiddenList=document.getElementById('hiddenList');
const coName=document.getElementById('coName');
const coPerson=document.getElementById('coPerson');
const coAddress=document.getElementById('coAddress');
const coTel=document.getElementById('coTel');
const coMail=document.getElementById('coMail');
const coReg=document.getElementById('coReg');
const stamp=document.getElementById('stamp');
const MASTER=[{"name": "仮設工事", "items": [{"name": "共用部養生　玄関前のみ", "unit": "式", "price": 2000}, {"name": "共用部養生　玄関前・ELV内", "unit": "式", "price": 15000}, {"name": "室内養生", "unit": "式", "price": 20000}, {"name": "養生テープ", "unit": "巻", "price": 300}, {"name": "プラベニヤ", "unit": "枚", "price": 250}]}, {"name": "解体工事", "items": [{"name": "住設機器・造作物・木枠等撤去", "unit": "㎡", "price": 2950}, {"name": "スケルトン解体", "unit": "㎡", "price": 4800}, {"name": "和室解体", "unit": "部屋", "price": 38000}, {"name": "既存床剥がし", "unit": "㎡", "price": 2300}, {"name": "フローリング撤去", "unit": "㎡", "price": 2000}, {"name": "床下地撤去", "unit": "式", "price": 35000}]}, {"name": "造作工事", "items": [{"name": "墨出し", "unit": "式", "price": 30000}, {"name": "置き床施工", "unit": "㎡", "price": 5500}, {"name": "天井下地組み", "unit": "㎡", "price": 3300}, {"name": "壁下地組み", "unit": "㎡", "price": 3100}, {"name": "天井ボード貼り　9.5㎜", "unit": "㎡", "price": 1800}, {"name": "壁ボード貼り　9.5㎜", "unit": "㎡", "price": 1700}, {"name": "フローリング貼り", "unit": "㎡", "price": 2500}, {"name": "直張りフローリング", "unit": "㎡", "price": 3000}, {"name": "建具取り付け　片開き", "unit": "箇所", "price": 13200}, {"name": "収納材取り付け", "unit": "箇所", "price": 8800}, {"name": "木巾木　キャップあり", "unit": "m", "price": 720}]}, {"name": "電気配線工事", "items": [{"name": "配線切り回し", "unit": "式", "price": 0}, {"name": "専用回路配線", "unit": "箇所", "price": 15000}, {"name": "分電盤交換　材工", "unit": "式", "price": 40000}, {"name": "ダクト工事", "unit": "式", "price": 0}, {"name": "エアコン先行配管　冷媒管・Fケーブル", "unit": "m", "price": 2000}]}, {"name": "水道配管工事", "items": [{"name": "配管部材", "unit": "式", "price": 0}, {"name": "配管施工", "unit": "式", "price": 0}]}, {"name": "内装仕上げ工事", "items": [{"name": "クロス　量産品", "unit": "㎡", "price": 900}, {"name": "クロス　一般品", "unit": "㎡", "price": 1080}, {"name": "フロアタイル", "unit": "㎡", "price": 2300}, {"name": "ＣＦ", "unit": "㎡", "price": 1500}, {"name": "洗面所・トイレ　ＣＦ", "unit": "式", "price": 20000}, {"name": "ソフト巾木　60㎜", "unit": "m", "price": 400}, {"name": "ソフト巾木　75㎜", "unit": "m", "price": 420}, {"name": "ソフト巾木　100㎜", "unit": "m", "price": 480}, {"name": "見切り材取り付け", "unit": "箇所", "price": 1800}, {"name": "シーラー塗布", "unit": "㎡", "price": 600}, {"name": "防カビシーラー", "unit": "㎡", "price": 650}]}, {"name": "住設機器等設置工事", "items": [{"name": "キッチン設置　～w1800パネル工事込み", "unit": "式", "price": 65000}, {"name": "トイレ内機器設置", "unit": "式", "price": 25000}, {"name": "洗面所内機器設置", "unit": "式", "price": 30000}, {"name": "ダウンライト設置", "unit": "台", "price": 3000}, {"name": "エアコン設置", "unit": "台", "price": 30000}, {"name": "カーテンレール取り付け", "unit": "箇所", "price": 3000}]}, {"name": "産廃処理", "items": [{"name": "産廃処理費", "unit": "㎥", "price": 15000}, {"name": "運搬費", "unit": "台", "price": 17000}, {"name": "畳処分費", "unit": "枚", "price": 2650}, {"name": "ガレキ類", "unit": "㎥", "price": 30000}, {"name": "45ℓ", "unit": "袋", "price": 900}, {"name": "70ℓ", "unit": "袋", "price": 1400}, {"name": "90ℓ", "unit": "袋", "price": 1800}, {"name": "搬出費　短距離", "unit": "㎥", "price": 1500}, {"name": "搬出費　中距離", "unit": "㎥", "price": 2000}, {"name": "搬出費　長距離", "unit": "㎥", "price": 3000}]}];const K='arty_est_v01';const today=new Date().toISOString().slice(0,10);let s=JSON.parse(localStorage.getItem(K)||'null')||{clients:[{id:'std',name:'ARTY標準',prices:{},hidden:{}}],current:'std',meta:{customer:'',project:'',title:'御見積書',date:today,notes:''},qty:{},custom:{},company:{name:'ARTY WORKS',person:'',address:'',tel:'',mail:'',reg:'',stamp:''}};function save(){localStorage.setItem(K,JSON.stringify(s))}function C(){return s.clients.find(x=>x.id===s.current)||s.clients[0]}function key(a,b){return a+'_'+b}function yen(v){return Math.round(Number(v)||0).toLocaleString('ja-JP')+' 円'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function price(si,ii,b){let k=key(si,ii);return C().prices[k]!==undefined?C().prices[k]:b}
function renderClient(){client.innerHTML=s.clients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');client.value=s.current;client.onchange=()=>{s.current=client.value;save();render()}}
function render(){renderClient();secs.innerHTML='';MASTER.forEach((sec,si)=>{let box=document.createElement('div');box.className='sec';box.innerHTML=`<div class="secH">${esc(sec.name)}<span></span><button onclick="addCustom(${si})">＋自由項目</button></div><div class="rows" id="r${si}"></div><div class="secAct"><button onclick="addCustom(${si})">＋自由項目</button><button onclick="addNote(${si})">＋注意書き</button><button onclick="addSpace(${si})">＋空白</button></div>`;secs.appendChild(box);let rw=box.querySelector('.rows');sec.items.forEach((it,ii)=>{let k=key(si,ii);if(C().hidden[k])return;let q=s.qty[k]??'',p=price(si,ii,it.price),a=(Number(q)||0)*p;let r=document.createElement('div');r.className='row';r.innerHTML=`<input value="${esc(it.name)}" readonly><input value="${esc(it.unit)}" readonly style="text-align:center"><input class="p" inputmode="decimal" data-p="${k}" value="${p}"><input class="q" inputmode="decimal" data-q="${k}" value="${esc(q)}" placeholder="数量"><div class="amt">${q!==''?yen(a):'—'}</div><button class="x" onclick="hideItem('${k}')">×</button>`;rw.appendChild(r)});(s.custom[si]||[]).forEach((it,ci)=>{if(it.type==='space'){let d=document.createElement('div');d.style.height='14px';rw.appendChild(d);return}if(it.type==='note'){let d=document.createElement('div');d.innerHTML=`<input value="${esc(it.text||'')}" placeholder="注意書き" oninput="setCustom(${si},${ci},'text',this.value)">`;rw.appendChild(d);return}let q=it.qty??'',a=(Number(q)||0)*(Number(it.price)||0);let r=document.createElement('div');r.className='row';r.innerHTML=`<input value="${esc(it.name||'')}" placeholder="自由項目" oninput="setCustom(${si},${ci},'name',this.value)"><input value="${esc(it.unit||'式')}" oninput="setCustom(${si},${ci},'unit',this.value)"><input class="p" inputmode="decimal" value="${Number(it.price)||0}" oninput="setCustom(${si},${ci},'price',this.value)"><input class="q" inputmode="decimal" value="${esc(q)}" placeholder="数量" oninput="setCustom(${si},${ci},'qty',this.value)"><div class="amt">${q!==''?yen(a):'—'}</div><button class="x" onclick="delCustom(${si},${ci})">×</button>`;rw.appendChild(r)})});document.querySelectorAll('[data-q]').forEach(i=>i.oninput=e=>{s.qty[e.target.dataset.q]=e.target.value;save();renderPreview();updateAmounts()});document.querySelectorAll('[data-p]').forEach(i=>i.oninput=e=>{C().prices[e.target.dataset.p]=Number(e.target.value)||0;save();renderPreview();updateAmounts()});['customer','project','title','date','notes'].forEach(id=>{let e=document.getElementById(id);e.value=s.meta[id]||'';e.oninput=()=>{s.meta[id]=e.value;save();renderPreview()}});renderPreview();save()}
function updateAmounts(){document.querySelectorAll('.row').forEach(r=>{let q=r.querySelector('.q'),p=r.querySelector('.p'),a=r.querySelector('.amt');if(q&&p&&a)a.textContent=q.value!==''?yen((Number(q.value)||0)*(Number(p.value)||0)):'—'})}function hideItem(k){C().hidden[k]=true;save();render()}function showHidden(){let h='';MASTER.forEach((sec,si)=>sec.items.forEach((it,ii)=>{let k=key(si,ii);if(C().hidden[k])h+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ddd"><span>${esc(sec.name)} / ${esc(it.name)}</span><button onclick="restore('${k}')">戻す</button></div>`}));hiddenList.innerHTML=h||'<div class="small">非表示項目はありません。</div>';hiddenModal.classList.add('on')}function restore(k){delete C().hidden[k];save();showHidden();render()}function addCustom(si){s.custom[si]=s.custom[si]||[];s.custom[si].push({type:'item',name:'',unit:'式',price:0,qty:''});save();render()}function addNote(si){s.custom[si]=s.custom[si]||[];s.custom[si].push({type:'note',text:''});save();render()}function addSpace(si){s.custom[si]=s.custom[si]||[];s.custom[si].push({type:'space'});save();render()}function setCustom(si,ci,f,v){s.custom[si][ci][f]=v;save();renderPreview();updateAmounts()}function delCustom(si,ci){s.custom[si].splice(ci,1);save();render()}
function renderPreview(){let body='',sum=0,any=false;MASTER.forEach((sec,si)=>{let rows=[],notes=[],st=0;sec.items.forEach((it,ii)=>{let k=key(si,ii),q=s.qty[k];if(C().hidden[k])return;if(q!==undefined&&q!==''&&Number(q)!==0){let p=price(si,ii,it.price),a=(Number(q)||0)*p;rows.push([it.name,p,q,it.unit,a]);st+=a}});(s.custom[si]||[]).forEach(it=>{if(it.type==='note'&&(it.text||'').trim())notes.push(it.text.trim());if(it.type==='item'&&it.qty!==undefined&&it.qty!==''&&Number(it.qty)!==0){let a=(Number(it.qty)||0)*(Number(it.price)||0);rows.push([it.name||'任意項目',Number(it.price)||0,it.qty,it.unit||'',a]);st+=a}});if(rows.length||notes.length){any=true;sum+=st;body+=`<div class="ph">${esc(sec.name)}</div>`;if(rows.length){body+='<table><tr><th>品名</th><th>単価</th><th>数量</th><th>単位</th><th>金額</th></tr>';rows.forEach(r=>body+=`<tr><td>${esc(r[0])}</td><td>${yen(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${yen(r[4])}</td></tr>`);body+=`</table><div class="sub">${esc(sec.name)} 小計　${yen(st)}</div>`}notes.forEach(n=>body+=`<div style="padding:5px 7px">※ ${esc(n)}</div>`)}});let tax=Math.round(sum*.1),grand=sum+tax,co=s.company;paper.innerHTML=`<h1>${esc(s.meta.title||'御見積書')}</h1><div class="pTop"><div><strong style="font-size:15px">${esc(s.meta.customer||'御中')}</strong><br>${esc(s.meta.project||'')}<br>見積日：${esc(s.meta.date||'')}</div><div class="company"><strong>${esc(co.name||'')}</strong><br>${esc(co.person||'')}<br>${esc(co.address||'')}<br>${esc(co.tel||'')}　${esc(co.mail||'')}<br>${co.reg?'登録番号：'+esc(co.reg):''}${co.stamp?`<img class="stamp" src="${co.stamp}">`:''}</div></div>${any?body:'<div class="empty">数量を入力した項目だけ、ここに表示されます。</div>'}<div class="tot"><div><span>小計</span><b>${yen(sum)}</b></div><div><span>消費税（10%）</span><b>${yen(tax)}</b></div><div class="grand"><span>合計金額</span><b>${yen(grand)}</b></div></div>${s.meta.notes?`<div style="margin-top:18px;border-top:1px solid #aaa;padding-top:8px"><b>備考</b><br>${esc(s.meta.notes)}</div>`:''}`}
function addClient(){let n=prompt('取引先名');if(!n)return;let id='c'+Date.now();s.clients.push({id,name:n,prices:{},hidden:{}});s.current=id;save();render()}function newDoc(){if(!confirm('数量・現場情報・自由項目をクリアしますか？\n取引先別単価と自社情報は残ります。'))return;s.qty={};s.custom={};s.meta={customer:'',project:'',title:'御見積書',date:today,notes:''};save();render()}function openCompany(){let c=s.company;coName.value=c.name||'';coPerson.value=c.person||'';coAddress.value=c.address||'';coTel.value=c.tel||'';coMail.value=c.mail||'';coReg.value=c.reg||'';companyModal.classList.add('on')}function closeCompany(){companyModal.classList.remove('on')}function saveCompany(){s.company.name=coName.value;s.company.person=coPerson.value;s.company.address=coAddress.value;s.company.tel=coTel.value;s.company.mail=coMail.value;s.company.reg=coReg.value;let f=stamp.files[0];if(f){let rd=new FileReader();rd.onload=()=>{s.company.stamp=rd.result;save();closeCompany();renderPreview()};rd.readAsDataURL(f)}else{save();closeCompany();renderPreview()}}render();</script></body></html>
