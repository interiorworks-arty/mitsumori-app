function pdfNewPage(stage){

  page.className='pdfPage';

}
function pdfOver(inner){return inner.scrollHeight>inner.clientHeight+2}
function pdfSectionShell(inner,title,continued){
  const sec=document.createElement('section');sec.className='psec';
  const ph=document.createElement('div');ph.className='ph'+(continued?' cont':'');
  ph.textContent=title+(continued?'（続き）':'');sec.appendChild(ph);inner.appendChild(sec);return sec;
}
function pdfTableShell(sec,srcTable){
  const table=document.createElement('table');
  const thead=srcTable.querySelector('thead');if(thead)table.appendChild(thead.cloneNode(true));
  const tbody=document.createElement('tbody');table.appendChild(tbody);sec.appendChild(table);return {table,tbody};
}
function buildPdfPages(stage){
  const src=paper;
  const children=[...src.children];
  const firstSec=children.findIndex(n=>n.classList&&n.classList.contains('psec'));
  const lastSec=(()=>{let x=-1;children.forEach((n,i)=>{if(n.classList&&n.classList.contains('psec'))x=i});return x})();
  let inner=pdfNewPage(stage);
  const headers=(firstSec<0?children:children.slice(0,firstSec));
  headers.forEach(n=>inner.appendChild(n.cloneNode(true)));

  const sections=children.filter(n=>n.classList&&n.classList.contains('psec'));
  sections.forEach(srcSec=>{
    const title=(srcSec.querySelector('.ph')?.textContent||'').trim();
    const srcTable=srcSec.querySelector('table');
    const srcSub=srcSec.querySelector('.sub');
    const extra=[...srcSec.children].filter(n=>!n.classList.contains('ph')&&n.tagName!=='TABLE'&&!n.classList.contains('sub'));
    let sec=pdfSectionShell(inner,title,false);
    let shell=null;
    if(srcTable){
      shell=pdfTableShell(sec,srcTable);
      const rows=[...srcTable.querySelectorAll('tbody tr')];
      rows.forEach((row,ri)=>{
        const nr=row.cloneNode(true);shell.tbody.appendChild(nr);
        if(pdfOver(inner)){
          shell.tbody.removeChild(nr);
          // Do not leave a heading/table header without any item row at the page bottom.
          if(shell.tbody.children.length===0){sec.remove();}
          inner=pdfNewPage(stage);sec=pdfSectionShell(inner,title,true);shell=pdfTableShell(sec,srcTable);shell.tbody.appendChild(nr);
        }
      });
      if(srcSub){
        const sub=srcSub.cloneNode(true);sec.appendChild(sub);
        if(pdfOver(inner)){
          sec.removeChild(sub);
          // Keep subtotal with at least the last item when possible.
          const lastRow=shell.tbody.lastElementChild;
          if(lastRow){
            shell.tbody.removeChild(lastRow);
            inner=pdfNewPage(stage);sec=pdfSectionShell(inner,title,true);shell=pdfTableShell(sec,srcTable);shell.tbody.appendChild(lastRow);sec.appendChild(sub);
          }else{
            inner=pdfNewPage(stage);sec=pdfSectionShell(inner,title,true);sec.appendChild(sub);
          }
        }
      }
    }
    extra.forEach((node,ei)=>{
      const nn=node.cloneNode(true);sec.appendChild(nn);
      if(pdfOver(inner)){
        sec.removeChild(nn);
        inner=pdfNewPage(stage);sec=pdfSectionShell(inner,title,true);sec.appendChild(nn);
      }
    });
    // If even the first heading block itself overflowed, shift it as a unit.
    if(pdfOver(inner)){
      const moved=sec.cloneNode(true);sec.remove();inner=pdfNewPage(stage);inner.appendChild(moved);
    }
  });

  if(lastSec>=0){
    const tail=children.slice(lastSec+1);
    tail.forEach(n=>{
      const nn=n.cloneNode(true);inner.appendChild(nn);
      if(pdfOver(inner)){
        inner.removeChild(nn);inner=pdfNewPage(stage);inner.appendChild(nn);
      }
    });
  }
  // Remove any accidentally empty trailing page.
  const pages=[...stage.querySelectorAll('.pdfPage')];
  const last=pages[pages.length-1];if(last&&last.querySelector('.pdfPageInner').children.length===0)last.remove();
}
async function exportPDF(){
  if(typeof html2canvas==='undefined'||!window.jspdf||!window.jspdf.jsPDF){
    alert('PDF機能の読み込みに失敗しました。通信状態を確認して、ページを再読み込みしてください。');
    return;
  }
  renderPreview();
  const btn=document.getElementById('pdfBtn');
  const busy=document.getElementById('pdfBusy');
  if(btn)btn.disabled=true;if(busy)busy.classList.add('on');
  await new Promise(r=>setTimeout(r,100));
  const stage=document.createElement('div');stage.className='pdfExportStage';document.body.appendChild(stage);
  try{
    buildPdfPages(stage);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const pages=[...stage.querySelectorAll('.pdfPage')];
    if(!pages.length)throw new Error('PDF page not built');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){
      const page=pages[i];
      const canvas=await html2canvas(page,{scale:3,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,logging:false,windowWidth:page.scrollWidth,windowHeight:page.scrollHeight});
      if(i>0)pdf.addPage('a4','portrait');
      const img=canvas.toDataURL('image/png');
      pdf.addImage(img,'PNG',0,0,210,297,undefined,'FAST');
    }
    const clean=(v)=>String(v||'').trim().replace(/[\/:*?"<>|]/g,'_').replace(/\s+/g,' ');
    const parts=[clean(s.meta.customer),clean(s.meta.project),clean(s.meta.date)].filter(Boolean);
    const filename=(parts.length?parts.join('_'):'見積書')+'.pdf';
    pdf.save(filename);
  }catch(err){console.error(err);alert('PDFの作成に失敗しました。もう一度試してください。');}
  finally{stage.remove();if(busy)busy.classList.remove('on');if(btn)btn.disabled=false;}
}

function startDrag(e){

function dragMove(e){
  if(!dragState)return;e.preventDefault();
  document.querySelectorAll('.dropBefore,.dropAfter').forEach(x=>x.classList.remove('dropBefore','dropAfter'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const target=el&&el.closest('.row[data-drag-kind]');
  if(!target||target===dragState.row||Number(target.dataset.si)!==dragState.si)return;
  // Built-in items can reorder among built-ins; registered custom items among registered custom items.
  if(target.dataset.dragKind!==dragState.kind)return;
  const rect=target.getBoundingClientRect(),after=e.clientY>rect.top+rect.height/2;
  target.classList.add(after?'dropAfter':'dropBefore');
  dragState.target=target;dragState.after=after;
}
function dragEnd(e){
  if(!dragState)return;
  const st=dragState;dragState=null;
  st.row.classList.remove('dragging');
  document.querySelectorAll('.dropBefore,.dropAfter').forEach(x=>x.classList.remove('dropBefore','dropAfter'));
  const handle=e.currentTarget;
  handle.removeEventListener('pointermove',dragMove);
  if(!st.target)return;
  if(st.kind==='builtin'){
    let from=Number(st.row.dataset.ii),to=Number(st.target.dataset.ii)+(st.after?1:0);
    if(to>from)to--;
    if(to===from)return;
    // Move by adjacent swaps so qty/price/hidden remain attached to the same item.
    const step=to>from?1:-1;
    while(from!==to){
      const next=from+step;
      const arr=MASTER[st.si].items;
      [arr[from],arr[next]]=[arr[next],arr[from]];
      swapObjIndex(s.qty,st.si,from,next);
      for(const c of s.clients){swapObjIndex(c.prices,st.si,from,next);swapObjIndex(c.hidden,st.si,from,next)}
      const a=masterEdits[masterKey(st.si,from)],b=masterEdits[masterKey(st.si,next)];
      if(b===undefined)delete masterEdits[masterKey(st.si,from)];else masterEdits[masterKey(st.si,from)]=b;
      if(a===undefined)delete masterEdits[masterKey(st.si,next)];else masterEdits[masterKey(st.si,next)]=a;
      from=next;
    }
    saveMasterEdits();save();render();
  }else{
    const arr=s.userMaster[st.si]||[];
    const from=arr.findIndex(x=>x.id===st.row.dataset.userId);
    let to=arr.findIndex(x=>x.id===st.target.dataset.userId);
    if(from<0||to<0)return;
    if(st.after)to++;
    if(to>from)to--;
    if(to===from)return;
    const [it]=arr.splice(from,1);arr.splice(to,0,it);save();render();
  }
}
function bindInlineLongPress(){
  document.querySelectorAll('.longEdit[data-edit-kind]').forEach(el=>{
    if(el.dataset.lp==='1')return;el.dataset.lp='1';
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      clearLP();lpEl=el;lpX=e.clientX;lpY=e.clientY;
      lpTimer=setTimeout(()=>{el.classList.add('press');setTimeout(()=>{clearLP();openInlineFrom(el)},80)},520);
    });
    el.addEventListener('pointermove',e=>{if(lpTimer&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))clearLP()});
    el.addEventListener('pointerup',clearLP);el.addEventListener('pointercancel',clearLP);
    el.addEventListener('contextmenu',e=>{e.preventDefault();openInlineFrom(el)});
  });
}
